services:
  postgres:
    image: postgres:15-alpine
    container_name: netflix-db
    environment:
      POSTGRES_DB: ${DB_NAME:-netflix_ai_watch}
      POSTGRES_USER: ${DB_USER:-netflix_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-netflix_secure_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: netflix-redis
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4
    container_name: netflix-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8888:80"
    depends_on:
      - postgres

  livekit:
    image: livekit/livekit-server:latest
    container_name: netflix-livekit
    command: --keys devkey:secret --dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  postgres_data:
