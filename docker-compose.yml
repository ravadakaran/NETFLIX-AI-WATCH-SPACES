services:
  postgres:
    image: postgres:15-alpine
    container_name: netflix-db
    environment:
      POSTGRES_DB: ${DB_NAME:-netflix_ai_watch}
      POSTGRES_USER: ${DB_USER:-netflix_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-netflix_secure_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: netflix-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8888:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
