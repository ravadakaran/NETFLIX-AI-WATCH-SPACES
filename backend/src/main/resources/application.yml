spring:
  # Load the project-level .env when the app is started from backend/ (the
  # documented Maven command). Environment variables still take precedence.
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: netflix-ai-watch-spaces
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:5433/${DB_NAME:netflix_ai_watch}${DB_PARAMS:}
    username: netflix_admin
    password: netflix_secure_password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
    validate-on-migrate: false
    baseline-on-migrate: true
    baseline-version: "1"
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET}
    expirationMs: ${JWT_EXPIRATION_MS:86400000}
    refreshExpirationMs: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  gemini:
    api-key: ${GEMINI_API_KEY:dummy}

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:https://s3.us-east-1.amazonaws.com}
    region: ${AWS_REGION:us-east-1}
    bucket-name: ${AWS_S3_BUCKET_NAME:netflix-ai-assets}
    access-key: ${AWS_ACCESS_KEY_ID:dummy}
    secret-key: ${AWS_SECRET_ACCESS_KEY:dummy}


livekit:
  api-key: 
  api-secret: 
  url: 

