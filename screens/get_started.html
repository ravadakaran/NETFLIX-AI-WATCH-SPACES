<!-- Interactive Password Reveal & Dynamic Strength Script -->
<script>
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');
    const meter = document.getElementById('strength-meter');
    const strengthText = document.getElementById('strength-text');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (passwordInput && meter && strengthText) {
      passwordInput.addEventListener('input', (e) => {
        const val = e.target.value;
        if (val.length === 0) {
          meter.style.width = '10%';
          meter.className = 'h-full bg-outline-variant transition-all duration-300 rounded-full';
          strengthText.textContent = 'minimum 8 characters';
          strengthText.className = 'text-outline font-medium lowercase tracking-normal';
        } else if (val.length < 6) {
          meter.style.width = '30%';
          meter.className = 'h-full bg-error transition-all duration-300 rounded-full';
          strengthText.textContent = 'weak password';
          strengthText.className = 'text-error font-medium lowercase tracking-normal';
        } else if (val.length < 10) {
          meter.style.width = '65%';
          meter.className = 'h-full bg-gradient-to-r from-primary to-secondary transition-all duration-300 rounded-full';
          strengthText.textContent = 'good security';
          strengthText.className = 'text-primary font-medium lowercase tracking-normal';
        } else {
          meter.style.width = '100%';
          meter.className = 'h-full bg-gradient-to-r from-primary via-secondary to-tertiary transition-all duration-300 rounded-full';
          strengthText.textContent = 'cinematic cipher active';
          strengthText.className = 'text-tertiary font-medium lowercase tracking-normal';
        }
      });
    }
  </script>
